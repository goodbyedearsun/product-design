<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tailnet Guided Setup</title>
<meta name="description" content="Use-case-driven onboarding prototype for the Tailscale admin console. Unofficial concept, not affiliated with Tailscale.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{
    color-scheme: light dark;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body{margin:0}
  img{max-width:100%}
  [hidden]{display:none !important}
  .sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
</style>
</head>
<body>
<style>
  /* ============ tokens ============ */
  :root{
    --bg-app:#FFFFFF;
    --bg-base:#FFFFFF;
    --bg-sunken:#F7F7F6;
    --gray-100:#F5F4F3;
    --gray-200:#E8E7E5;
    --gray-300:#D6D4D1;
    --border:#DEDCD9;
    --text-base:#232222;
    --text-muted:#706E6C;
    --text-faint:#95928F;
    --blue-0:#F1F5FF;
    --blue-100:#DCE5FD;
    --blue-300:#ADC7FC;
    --blue-500:#4B70F5;
    --blue-600:#3B5BDB;
    --blue-700:#2F49B3;
    --blue-text:#3455D1;
    --green:#0D7A56;
    --green-bg:#E4F3EC;
    --amber:#8A5A0B;
    --amber-bg:#FBEFD8;
    --radius:6px;
    --f-ui:"Inter","Helvetica Neue",Arial,sans-serif;
    --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg-app:#1F1E1E;
      --bg-base:#2A2928;
      --bg-sunken:#252423;
      --gray-100:#2A2928;
      --gray-200:#343231;
      --gray-300:#413F3D;
      --border:#383635;
      --text-base:#EDECEA;
      --text-muted:#A6A29F;
      --text-faint:#7C7876;
      --blue-0:#17233D;
      --blue-100:#1E2D4D;
      --blue-300:#3F5DB3;
      --blue-500:#6C94EC;
      --blue-600:#4A69D4;
      --blue-700:#3F5DB3;
      --blue-text:#8FAEF5;
      --green:#4CC49A;
      --green-bg:#12271F;
      --amber:#D5A24F;
      --amber-bg:#2A2214;
    }
  }
  :root[data-theme="dark"]{
    --bg-app:#1F1E1E;
    --bg-base:#2A2928;
    --bg-sunken:#252423;
    --gray-100:#2A2928;
    --gray-200:#343231;
    --gray-300:#413F3D;
    --border:#383635;
    --text-base:#EDECEA;
    --text-muted:#A6A29F;
    --text-faint:#7C7876;
    --blue-0:#17233D;
    --blue-100:#1E2D4D;
    --blue-300:#3F5DB3;
    --blue-500:#6C94EC;
    --blue-600:#4A69D4;
    --blue-700:#3F5DB3;
    --blue-text:#8FAEF5;
    --green:#4CC49A;
    --green-bg:#12271F;
    --amber:#D5A24F;
    --amber-bg:#2A2214;
  }

  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg-app);color:var(--text-base);
    font-family:var(--f-ui);font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.011em;text-wrap:balance}
  p{margin:0}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  a{color:var(--blue-text)}
  .link{color:var(--text-base);text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--gray-300)}
  :focus-visible{outline:2px solid var(--blue-500);outline-offset:1px;border-radius:4px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .mono{font-family:var(--f-mono);font-size:.86em}

  /* ============ app shell ============ */
  .shell{display:flex;align-items:flex-start;min-height:100vh}

  .sidebar{
    flex:none;width:15rem;align-self:stretch;
    position:sticky;top:env(safe-area-inset-top,0px);
    height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
    border-right:1px solid var(--border);background:var(--bg-app);
    display:flex;flex-direction:column;
  }
  .sb-top{height:56px;display:flex;align-items:center;padding:0 6px;border-bottom:1px solid var(--border);flex:none}

  /* the column narrows on small screens but never stacks or covers the page */
  @media (max-width:900px){ .sidebar{width:13rem} }
  @media (max-width:640px){ .sidebar{width:11.5rem} }
  .sb-ident{display:flex;align-items:center;width:100%;padding:6px 8px;gap:0;min-width:0}
  .mark{width:18px;height:18px;flex:none;margin-right:12px;color:var(--text-base)}
  .sb-email{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .badge-plan{
    margin-left:auto;padding-left:8px;flex:none;
  }
  .badge-plan span{
    display:inline-flex;align-items:center;font-size:13px;font-weight:500;
    background:var(--gray-200);color:var(--text-muted);border-radius:3px;padding:0 5px;
  }
  .sb-scroll{flex:1;min-height:0;overflow-y:auto;padding:6px;display:flex;flex-direction:column}
  .sb-bottom{padding:6px;border-top:1px solid var(--border);flex:none}

  .nav-row{
    position:relative;isolation:isolate;display:flex;align-items:center;gap:8px;
    width:100%;text-align:left;font-size:14px;color:var(--text-base);
    padding:6px 14px;text-decoration:none;
  }
  .nav-row::before{
    content:"";position:absolute;inset:1px 6px;z-index:-1;border-radius:6px;
  }
  .nav-row:hover::before{background:var(--gray-200)}
  .nav-row svg{width:16px;height:16px;flex:none}
  .nav-row .chev{margin-left:auto;width:14px;height:14px;color:var(--text-faint);transition:transform .15s ease}
  .nav-group[data-open="true"] .chev{transform:rotate(90deg)}
  .nav-kids{display:none;position:relative;flex-direction:column}
  .nav-group[data-open="true"] .nav-kids{display:flex}
  .nav-kid{
    position:relative;isolation:isolate;display:block;font-size:14px;color:var(--text-base);
    padding:7px 14px 7px 38px;text-decoration:none;
  }
  .nav-kid::before{content:"";position:absolute;inset:1px 6px;z-index:-1;border-radius:6px}
  .nav-kid:hover::before{background:var(--gray-200)}
  .nav-kid .guide{
    position:absolute;left:22px;top:0;bottom:0;width:1px;background:var(--gray-300);
  }
  .nav-kid:first-child .guide{top:8px}
  .nav-kid:last-child .guide{bottom:8px}
  .nav-kid[aria-current="page"]{font-weight:500}
  .nav-kid[aria-current="page"]::before{background:var(--gray-200)}
  .nav-kid[aria-current="page"] .marker{
    position:absolute;left:21px;top:50%;transform:translateY(-50%);
    width:3px;height:18px;border-radius:999px;background:var(--text-muted);z-index:1;
  }
  .sb-spacer{margin-top:auto;display:flex;flex-direction:column}

  .sb-user{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:6px;text-align:left;min-width:0}
  .sb-user:hover{background:var(--gray-200)}
  .avatar{
    width:28px;height:28px;border-radius:50%;flex:none;overflow:hidden;
    background:var(--blue-600);color:#fff;display:grid;place-items:center;
    font-size:11px;font-weight:600;letter-spacing:.02em;
  }
  .sb-user .who{display:flex;flex-direction:column;min-width:0;line-height:1.25}
  .sb-user .who b{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sb-user .who span{font-size:13px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* main */
  .main-wrap{flex:1;min-width:0}
  main{
    width:100%;margin:0 auto;max-width:1400px;
    padding:20px 24px 96px;
  }
  @media (min-width:1024px){ main{padding:32px 40px 96px} }

  .page-head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;justify-content:space-between}
  .page-head h1{font-size:30px;line-height:1.15;letter-spacing:-.02em}
  .page-head .sub{margin-top:8px;max-width:40rem;color:var(--text-base);font-size:15px}
  .chip-proto{
    display:inline-flex;align-items:center;font-size:11px;font-weight:600;letter-spacing:.06em;
    text-transform:uppercase;color:var(--amber);background:var(--amber-bg);
    border:1px solid color-mix(in srgb, var(--amber) 35%, transparent);
    border-radius:999px;padding:2px 8px;margin-left:10px;vertical-align:6px;
  }

  /* buttons */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    height:36px;padding:0 12px;border-radius:var(--radius);
    border:1px solid var(--border);background:var(--bg-base);
    font-size:14px;font-weight:500;color:var(--text-base);text-decoration:none;
    transition:background .12s ease,border-color .12s ease;
  }
  .btn:hover{background:var(--gray-100)}
  .btn.primary{background:var(--blue-500);border-color:var(--blue-500);color:#fff;font-weight:500}
  .btn.primary:hover{background:var(--blue-600);border-color:var(--blue-600)}
  .btn.quiet{border-color:transparent;background:transparent;color:var(--text-muted)}
  .btn.quiet:hover{background:var(--gray-200);color:var(--text-base)}
  .btn.sm{height:30px;padding:0 10px;font-size:13.5px}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .btn.primary{background:var(--blue-600);border-color:var(--blue-600)}
    :root:not([data-theme="light"]) .btn.primary:hover{background:var(--blue-500);border-color:var(--blue-500);color:#10131C}
  }
  :root[data-theme="dark"] .btn.primary{background:var(--blue-600);border-color:var(--blue-600)}
  :root[data-theme="dark"] .btn.primary:hover{background:var(--blue-500);border-color:var(--blue-500);color:#10131C}

  /* cards */
  .card{background:var(--bg-base);border:1px solid var(--border);border-radius:var(--radius)}
  .promo{
    position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid transparent;
    background:var(--blue-0);display:block;
  }
  .promo-body{display:flex;flex-direction:column;gap:12px;justify-content:center;padding:24px 32px;max-width:48rem}
  .promo-body h4{font-size:20px}
  .minimize{
    position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:var(--radius);
    display:grid;place-items:center;color:var(--text-base);z-index:3;
  }
  .minimize:hover{background:color-mix(in srgb, var(--text-base) 8%, transparent)}

  ol.numlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  ol.numlist li{display:flex;align-items:flex-start;gap:8px;font-size:15px}
  ol.numlist .n{
    flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
    background:var(--text-muted);color:var(--bg-app);font-size:12px;font-weight:600;margin-top:1px;
  }

  /* table */
  .tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-base)}
  table{border-collapse:collapse;width:100%;min-width:640px}
  th{
    text-align:left;font-size:12px;font-weight:600;color:var(--text-muted);
    padding:9px 16px;border-bottom:1px solid var(--border);background:var(--bg-sunken);
  }
  td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  .mname{font-weight:500}
  .maddr{font-family:var(--f-mono);font-size:12px;color:var(--text-faint);font-variant-numeric:tabular-nums}
  .tempty td{text-align:center;color:var(--text-muted);padding:28px}

  .pill{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;
    border-radius:999px;padding:2px 8px;border:1px solid var(--border);
    background:var(--bg-sunken);color:var(--text-muted);white-space:nowrap;
  }
  .pill.ok{color:var(--green);background:var(--green-bg);border-color:color-mix(in srgb,var(--green) 30%,transparent)}
  .pill.wait{color:var(--amber);background:var(--amber-bg);border-color:color-mix(in srgb,var(--amber) 32%,transparent)}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

  /* question screens */
  .qhead{max-width:44rem;margin-bottom:24px}
  .qhead .eyebrow{font-size:13px;color:var(--text-muted);margin-bottom:6px;display:block}
  .qhead h1{font-size:30px;letter-spacing:-.02em;margin-bottom:8px}
  .qhead p{color:var(--text-muted)}
  .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;margin-bottom:20px}
  .choice{
    display:flex;flex-direction:column;gap:10px;text-align:left;padding:22px;
    border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-base);
    transition:border-color .13s ease,background .13s ease;
  }
  .choice:hover{border-color:var(--blue-500);background:var(--blue-0)}
  .choice .ic{width:28px;height:28px;color:var(--blue-500)}
  .choice h3{font-size:17px}
  .choice p{font-size:14px;color:var(--text-muted)}
  .choice .eg{font-size:13px;color:var(--text-faint);border-top:1px solid var(--border);padding-top:10px;margin-top:2px}

  .goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:10px;margin-bottom:24px}
  .goal{
    display:flex;gap:10px;align-items:flex-start;text-align:left;padding:13px 14px;
    border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-base);
  }
  .goal:hover{border-color:var(--gray-300)}
  .goal[aria-pressed="true"]{border-color:var(--blue-500);background:var(--blue-0)}
  .cbox{
    width:16px;height:16px;flex:none;margin-top:2px;border-radius:4px;
    border:1.5px solid var(--gray-300);display:grid;place-items:center;color:transparent;
  }
  .goal .cbox{border-radius:50%}
  .goal .cbox svg{display:none}
  .goal[aria-pressed="true"] .cbox{border:5px solid var(--blue-500);background:var(--bg-base)}
  .goal b{display:block;font-size:14px;font-weight:600}
  .goal em{font-style:normal;display:block;font-size:13px;color:var(--text-muted);margin-top:1px}

  /* wizard layout */
  .wiz{max-width:760px;margin:0 auto}
  .progress-head{margin-bottom:14px}
  .progress-copy{display:flex;justify-content:space-between;gap:16px;margin-bottom:8px;font-size:13px;color:var(--text-muted)}
  .progress-copy b{font-weight:500;color:var(--text-base)}
  .progress-head .meter{margin-bottom:0}
  .rail{display:flex;flex-direction:column;gap:16px;position:sticky;top:24px}
  @media (max-width:1180px){ .rail{position:static} }
  .railcard{padding:16px}
  .railhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
  .railhead b{font-size:13px;font-weight:600}
  .railhead span{font-family:var(--f-mono);font-size:12px;color:var(--text-faint)}
  .meter{height:4px;border-radius:999px;background:var(--gray-200);overflow:hidden;margin-bottom:14px}
  .meter i{display:block;height:100%;background:var(--blue-500);border-radius:999px;transition:width .3s ease}
  ol.steplist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
  ol.steplist li{display:flex;gap:9px;align-items:flex-start;padding:6px 8px;border-radius:5px;font-size:13.5px;color:var(--text-muted)}
  ol.steplist li .n{
    flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;
    font-size:11px;font-weight:600;border:1.5px solid var(--gray-300);color:var(--text-faint);margin-top:1px;
  }
  ol.steplist li.done .n{background:var(--green);border-color:var(--green);color:var(--bg-app)}
  ol.steplist li.now{color:var(--text-base);font-weight:500;background:var(--gray-200)}
  ol.steplist li.now .n{background:var(--blue-500);border-color:var(--blue-500);color:#fff}

  .netcard{padding:14px 16px}
  .netcard h4{font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:10px}
  .netrow{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0}
  .netrow b{font-weight:500}
  .netrow .ip{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--text-faint);font-variant-numeric:tabular-nums}
  .netnone{font-size:13px;color:var(--text-faint)}

  .panel{padding:26px 28px 22px}
  @media (max-width:560px){ .panel{padding:20px 18px} }
  .panel .eyebrow{font-size:13px;color:var(--text-muted)}
  .panel h2{font-size:22px;letter-spacing:-.015em;margin:5px 0 8px}
  .lede{color:var(--text-muted);max-width:60ch;margin-bottom:20px}
  .step-sequence{counter-reset:d}
  ul.do{list-style:none;margin:0 0 20px;padding:0;display:flex;flex-direction:column;gap:14px}
  ul.do li{display:grid;grid-template-columns:20px 1fr;gap:11px;align-items:start;max-width:64ch}
  ul.do li::before{
    counter-increment:d;content:counter(d);
    width:20px;height:20px;border-radius:50%;display:grid;place-items:center;margin-top:1px;
    background:var(--text-muted);color:var(--bg-app);font-size:12px;font-weight:600;
  }
  ul.do li.optional-step{grid-template-columns:58px 1fr}
  ul.do li.optional-step::before{
    counter-increment:none;content:"Optional";width:auto;height:auto;padding:2px 7px;margin-top:1px;
    border:1px solid var(--border);border-radius:999px;background:var(--bg-sunken);color:var(--text-muted);font-size:10.5px;
  }
  ul.do em{font-style:normal;display:block;font-size:13.5px;color:var(--text-muted);margin-top:2px}
  .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .opt{font-size:12.5px;padding:3px 9px;border-radius:5px;background:var(--bg-sunken);border:1px solid var(--border);color:var(--text-muted)}

  .expect{
    display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;max-width:64ch;
    padding:12px 14px;border-radius:var(--radius);margin-bottom:16px;
    background:var(--green-bg);border:1px solid color-mix(in srgb,var(--green) 26%,transparent);
  }
  .expect svg{color:var(--green);margin-top:2px}
  .expect b{display:block;font-size:12px;font-weight:600;color:var(--green);margin-bottom:2px}
  .expect p{font-size:13.5px;color:var(--text-muted)}
  .stuck{
    padding:11px 14px;border-radius:var(--radius);border:1px dashed var(--gray-300);
    font-size:13.5px;color:var(--text-muted);margin:0;max-width:none;border:0;
  }
  .stuck b{color:var(--text-base)}

  details.adv{border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-sunken);margin-bottom:20px;max-width:64ch}
  details.adv summary{
    list-style:none;cursor:pointer;padding:9px 13px;font-size:13.5px;color:var(--text-muted);
    display:flex;align-items:center;gap:7px;
  }
  details.adv summary::-webkit-details-marker{display:none}
  details.adv summary::before{content:"\203A";font-size:16px;line-height:1;color:var(--text-faint);transition:transform .15s ease}
  details.adv[open] summary::before{transform:rotate(90deg)}
  details.adv .advbody{padding:0 13px 13px}
  pre{
    margin:0;overflow-x:auto;background:var(--bg-base);border:1px solid var(--border);
    border-radius:5px;padding:10px 12px;font-family:var(--f-mono);font-size:12.5px;line-height:1.65;
  }
  p.note{font-size:12.5px;color:var(--text-faint);margin-top:8px}
  details.verify{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;max-width:64ch}
  details.verify summary{cursor:pointer;padding:10px 13px;font-size:13.5px;font-weight:500;color:var(--text-base)}
  details.verify p{padding:0 13px 12px;font-size:13.5px;color:var(--text-muted)}

  .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:18px;border-top:1px solid var(--border)}
  .actions .grow{flex:1}

  .resource-row{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
  .resource-row .btn svg{width:14px;height:14px}
  .download-card{border:0;background:transparent;border-radius:0;padding:0;margin:0 0 20px;max-width:64ch}
  .download-card h3{font-size:15px;margin-bottom:3px}
  .download-card>p{font-size:13.5px;color:var(--text-muted);margin-bottom:13px;max-width:56ch}
  .download-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  var stage = document.getElementById('stage');

          ],
          help:'<b>Apple TV unavailable?</b> On tvOS 18 or later, assign it to a room under Settings → AirPlay and HomeKit → HomeKit. Then restart the Apple TV and try again.'},

          links:[{label:'View Linux installation guide',href:'https://tailscale.com/docs/install/linux'}],
          connectActions:[{id:'exit-device-connect',label:'Connect Linux device',description:'Sign in and add this device to the tailnet.',done:'Linux device connected'}]},
        computer:{label:'Mac or Windows computer',name:'home-computer',os:'Desktop',ip:'100.88.42.17',
          download:{id:'exit-device-download',title:'Get Tailscale for this computer',description:'Open the download page, email the setup link, or continue if Tailscale is already installed.',href:'https://tailscale.com/download'},
          links:[{label:'View exit-node setup guide',href:'https://tailscale.com/docs/features/exit-nodes/how-to/setup'}],
          connectActions:[{id:'exit-device-connect',label:'Connect computer',description:'Sign in and add this computer to the tailnet.',done:'Computer connected'}]}
      };
      var exitDevice = exitDevices[S.exitDevice] || {label:'home device',name:'home-device',os:'Device',ip:'100.88.42.17',download:null,links:[],connectActions:[]};
      return [
        {id:'a-exit-choose',eyebrow:'Exit node',title:'Choose a device that stays at home',
         lede:'This device will route your internet traffic through your home connection. Choose one that is usually powered on.',
         chooseExit:true,
         links:[{label:'Learn about exit nodes',href:'https://tailscale.com/docs/features/exit-nodes'}]},
        {id:'a-exit-add',eyebrow:'Home device',title:'Connect your '+exitDevice.label,
         lede:'Install Tailscale on this device, then connect it to your tailnet.',
         adds:{name:exitDevice.name,ip:exitDevice.ip,os:exitDevice.os},
         download:exitDevice.download,links:exitDevice.links,actions:exitDevice.connectActions,
         expect:'The device appears on the Machines page with a Connected status.'},
        {id:'a-exit-enable',eyebrow:'Exit node',title:'Enable this device as an exit node',
         lede:'Allow your '+exitDevice.label+' to route internet traffic through your home connection.',

        {id:'a-exit-carry',eyebrow:'Travel device',title:'Connect the device you’ll use away from home',
         lede:'Install Tailscale on the phone or computer that will use your home connection.',
         adds:{name:'macbook-air',ip:'100.101.5.12',os:'macOS'},
         download:{id:'travel-download',title:'Get Tailscale on this device',description:'Download it here, send the link to the device, or continue if it is already installed.',href:'https://tailscale.com/download'},
         actions:[

      ];

    if(S.path==='home' && S.goals.share){
      return STEPS.home.filter(function(s){return s.id==='a-always' || s.id==='a-share';});
    }
    var hasWorkSetup = S.goals.apps || S.goals.wfiles || S.goals.servers || S.goals.network;
    return STEPS[S.path].filter(function(s){
      if(s.need) return S.goals[s.need];
      if(S.path==='work' && (s.id==='w-laptop' || s.id==='w-other' || s.id==='w-check')) return !!hasWorkSetup;
      return true;

  function selectedGoal(){
    var keys = Object.keys(S.goals);
    for(var i=0;i<keys.length;i++){ if(S.goals[keys[i]]) return keys[i]; }
    return null;
  }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function deviceForStep(s){
    return s ? s.adds : null;
  }
  function addDev(d){
    if(!d) return;
    for(var i=0;i<S.devices.length;i++){ if(S.devices[i].name===d.name){ if(d.badge) S.devices[i].badge=d.badge; return; } }
    S.devices.push({name:d.name,ip:d.ip,os:d.os,badge:d.badge});
  }

  /* ---------------- views ---------------- */

  function vMachines(){
    var started = S.devices.length>0;
    var rows = started
      ? S.devices.map(function(d){
          return '<tr><td><div class="mname">'+esc(d.name)+'</div><div class="maddr">'+esc(d.ip)+'</div></td>'+
                 '<td>'+esc(d.os)+'</td>'+
                 '<td>'+(d.badge?'<span class="pill">'+esc(d.badge)+'</span>':'<span style="color:var(--text-faint)">Not set</span>')+'</td>'+ 
                 '<td><span class="pill ok"><span class="dot"></span>Connected</span></td></tr>';
        }).join('')
      : '<tr class="tempty"><td colspan="4">No machines yet. Add your first device to get started.</td></tr>';

    var promo = S.dismissed ? '' :
      '<div class="promo" style="margin-top:24px">'+
        '<button class="minimize" data-go="dismiss" aria-label="Dismiss guided setup">'+IC.minus+'</button>'+ 
        '<div class="promo-body">'+
          '<h4>'+(started?'Continue guided setup':'Set up Tailscale for what you need')+'</h4>'+ 
          '<p>'+(started
              ? 'Continue where you left off.'
              : 'Choose what you want to access, and we’ll guide you through setup.')+'</p>'+ 
          '<div style="display:flex;gap:12px;flex-wrap:wrap">'+
            '<button class="btn primary" data-go="'+(S.path?'wizard':'pick')+'">'+(started?'Continue setup':'Get started')+'</button>'+ 
          '</div>'+
        '</div>'+
      '</div>';

    stage.innerHTML =
      '<section>'+
        '<header class="page-head">'+
          '<div style="flex:1 1 320px;min-width:0">'+
            '<h1>Machines<span class="chip-proto">Onboarding prototype</span></h1>'+
            '<p class="sub">Manage the devices connected to your tailnet. <a class="link" href="#">See how to manage devices</a></p>'+
          '</div>'+
          '<button class="btn primary" style="margin-top:4px">Add device '+IC.chevDown+'</button>'+
        '</header>'+
        promo+
        '<div style="margin-top:24px" class="tablewrap"><table><thead><tr>'+
          '<th>Machine</th><th>OS</th><th>Routes &amp; tags</th><th>Status</th>'+
        '</tr></thead><tbody>'+rows+'</tbody></table></div>'+
      '</section>';

  function vPick(){
    stage.innerHTML =
      '<section>'+
        '<div class="qhead">'+
          '<span class="eyebrow">Guided setup · Question 1 of 2</span>'+
          '<h1>Where are the things you want to reach?</h1>'+ 
          '<p>Choose the location of the device or service you want to reach.</p>'+ 
        '</div>'+
        '<div class="choices">'+
          '<button class="choice" data-path="home">'+IC.home+
            '<h3>At home</h3>'+ 
            '<p>Reach devices and services on your home network when you’re away.</p>'+ 
            '<span class="eg">NAS · media library · home desktop · printer · smart-home hub</span></button>'+
          '<button class="choice" data-path="work">'+IC.work+
            '<h3>At work</h3>'+ 
            '<p>Reach devices and services in an office or cloud network.</p>'+

    var any = Object.keys(S.goals).some(function(k){return S.goals[k];});

      '<section>'+
        '<div class="qhead">'+
          '<span class="eyebrow">Guided setup · Question 2 of 2 · '+esc(META[S.path].label)+'</span>'+
          '<h1>What do you want to set up first?</h1>'+ 
          '<p>Choose one. You can set up something else when you finish.</p>'+ 
        '</div>'+
        '<div class="goals">'+GOALS[S.path].map(function(g){
          return '<button class="goal" data-goal="'+g.id+'" aria-pressed="'+(S.goals[g.id]?'true':'false')+'">'+
                 '<span class="cbox">'+IC.check+'</span>'+
                 '<span><b>'+esc(g.t)+'</b><em>'+esc(g.d)+'</em></span></button>';
        }).join('')+'</div>'+
        '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+
          '<button class="btn primary" data-go="wizard"'+(any?'':' disabled')+'>Continue</button>'+ 
          '<button class="btn quiet" data-go="pick">← Change location</button>'+ 
          (any?'':'<span style="font-size:13.5px;color:var(--text-faint)">Choose one to continue.</span>')+
        '</div>'+
      '</section>';
  }

  function rail(list){
    var done = list.filter(function(s){return S.done[s.id];}).length;
    var pct = list.length ? Math.round(done/list.length*100) : 0;
    var net = S.devices.length
      ? S.devices.map(function(d){
          return '<div class="netrow"><span class="dot" style="color:var(--green)"></span><b>'+esc(d.name)+'</b>'+
                 (d.badge?'<span class="pill">'+esc(d.badge)+'</span>':'')+
                 '<span class="ip">'+esc(d.ip)+'</span></div>';
        }).join('')
      : '<p class="netnone">Nothing yet. Your first device shows up here as soon as you add it.</p>';

    return '<aside class="rail">'+
      '<div class="card railcard">'+
        '<div class="railhead"><b>'+esc(META[S.path].title)+'</b><span>'+done+'/'+list.length+'</span></div>'+
        '<div class="meter"><i style="width:'+pct+'%"></i></div>'+
        '<ol class="steplist">'+list.map(function(s,n){
          var cls = S.done[s.id] ? 'done' : (n===S.i ? 'now' : '');
          return '<li class="'+cls+'"><span class="n">'+(S.done[s.id]?IC.check:(n+1))+'</span><span>'+esc(s.title)+'</span></li>';
        }).join('')+'</ol>'+
      '</div>'+
      '<div class="card netcard"><h4>Devices added</h4>'+net+'</div>'+ 
      '<button class="btn quiet" data-go="machines" style="align-self:flex-start">← Machines</button>'+
    '</aside>';
  }

  function simRoute(kind){
    var cidr = kind==='route-work' ? '10.0.0.0/16' : '192.168.1.0/24';
    var who  = kind==='route-work' ? 'office-gateway' : 'home-server';
    return requiredBlock('<div class="sim"><div class="sim-head">Machines → '+esc(who)+' → Subnets</div><div class="sim-body"><div class="simrow">'+
      '<span class="mono" style="color:var(--text-base)">'+cidr+'</span>'+ 
      (S.routes[cidr]
        ? '<span class="pill ok">'+IC.check+' Approved</span><span style="font-size:13.5px;color:var(--text-muted)">The route is available to devices allowed by your access controls.</span>'
        : '<span class="pill wait"><span class="dot"></span>Waiting for you</span><button class="btn primary sm" data-approve="'+cidr+'">Approve route</button>')+
      '</div></div></div>');
  }

  function simCheck(id){
    var st = S.checked[id];
    if(st==='ok'){
      return requiredBlock('<div class="sim"><div class="sim-head">Connection test</div><div class="sim-body">'+
        '<div class="simrow"><span class="pill ok">'+IC.check+' Reply received</span>'+ 
        '<span class="mono" style="color:var(--text-muted)">round trip 41 ms · direct connection</span></div>'+ 
        '<p style="font-size:13.5px;color:var(--text-muted)">Direct means the devices connected without using a Tailscale relay server.</p>'+ 
        '</div></div>');
    }
    if(st==='run'){
      return requiredBlock('<div class="sim"><div class="sim-head">Connection test</div><div class="sim-body">'+
        '<span class="simrow" style="color:var(--text-muted);font-size:13.5px"><span class="spin"></span>Reaching the other device…</span></div></div>');
    }
    return requiredBlock('<div class="sim"><div class="sim-head">Connection test</div><div class="sim-body"><div class="simrow">'+
      '<span style="font-size:13.5px;color:var(--text-muted)">This test will try to reach the other device from this one.</span>'+ 
      '<button class="btn primary sm" data-check="'+id+'">Run the test</button></div></div></div>');
  }

  function resourceLinks(items){
    if(!items || !items.length) return '';
    return '<div class="resource-row">'+items.map(function(item){
      return '<a class="btn" href="'+esc(item.href)+'" target="_blank" rel="noopener">'+esc(item.label)+' <span aria-hidden="true">↗</span></a>';
    }).join('')+'</div>';
  }

  function requiredBlock(content){
    return '<div class="required-block">'+content+'</div>';
  }

  function downloadCard(item){
    if(!item) return '';
    var choice = S.actions[item.id];
    if(choice){
      var status = choice==='email' ? 'Download link sent' : (choice==='installed' ? 'Tailscale already installed' : 'Download opened');
      return requiredBlock('<div class="download-card done"><h3>'+esc(item.title)+'</h3><span class="pill ok">'+IC.check+' '+esc(status)+'</span></div>');
    }
    return requiredBlock('<div class="download-card">'+
      '<h3>'+esc(item.title)+'</h3><p>'+esc(item.description)+'</p>'+ 
      '<div class="download-actions">'+
        '<a class="btn primary" href="'+esc(item.href)+'" target="_blank" rel="noopener" data-download-action="'+esc(item.id)+'">'+esc(item.button||'Download Tailscale')+' <span aria-hidden="true">↗</span></a>'+ 
        '<button class="btn" data-show-email="'+esc(item.id)+'">Email download link</button>'+ 
        '<button class="btn quiet" data-installed-action="'+esc(item.id)+'">Already installed</button>'+ 
      '</div>'+ 
      '<div class="email-form" data-email-form="'+esc(item.id)+'" hidden>'+ 
        '<label class="sr-only" for="email-'+esc(item.id)+'">Email address</label>'+ 
        '<input id="email-'+esc(item.id)+'" type="email" autocomplete="email" placeholder="name@example.com" data-email-input="'+esc(item.id)+'">'+ 
        '<button class="btn primary" data-send-email="'+esc(item.id)+'">Send link</button>'+ 
      '</div>'+ 
      '<p class="field-error" data-email-error="'+esc(item.id)+'" hidden>Enter an email address.</p>'+ 
    '</div>');
  }

  function inlineActions(items){
    if(!items || !items.length) return '';
    return '<div class="taskbox"><div class="taskbox-head">Complete in Tailscale</div>'+items.map(function(item){
      var complete = !!S.actions[item.id];
      return '<div class="taskrow"><div class="taskrow-copy"><b>'+esc(item.label)+'</b><span>'+esc(item.description)+'</span></div>'+ 
        (complete
          ? '<span class="pill ok">'+IC.check+' '+esc(item.done)+'</span>'
          : '<button class="btn primary sm" data-inline-action="'+esc(item.id)+'">'+esc(item.label)+'</button>')+
        '</div>';
    }).join('')+'</div>';
  }

  function exitDeviceOptions(){
    var items = [
      {id:'appletv',label:'Apple TV',description:'Good for an always-on home setup'},
      {id:'linux',label:'Linux device',description:'A server, NAS, or Raspberry Pi'},
      {id:'computer',label:'Mac or Windows',description:'A computer that stays powered on'}
    ];
    return requiredBlock('<div class="device-options">'+items.map(function(item){
      return '<button class="device-option" data-exit-device="'+item.id+'" aria-pressed="'+(S.exitDevice===item.id?'true':'false')+'"><b>'+esc(item.label)+'</b><span>'+esc(item.description)+'</span></button>';
    }).join('')+'</div>');
  }

  function vWizard(){
    var list = steps();
    if(S.i >= list.length){ S.view='done'; return vDone(); }
    var s = list[S.i], last = S.i===list.length-1;
    var canContinue = !s.chooseExit || !!S.exitDevice;
    var verification = s.expect
      ? (s.kind==='check' && S.checked[s.id]==='ok'
          ? '<div class="expect">'+IC.check+'<div><b>Connection confirmed</b><p>'+s.expect+'</p></div></div>'
          : '<details class="verify"><summary>How to confirm it worked</summary><p>'+s.expect+'</p></details>')
      : '';
    var help = s.stuck
      ? '<details class="adv"><summary>Having trouble?</summary><div class="stuck">'+s.stuck+'</div></details>'
      : '';

    var panel = '<section class="card panel">'+
      '<h2>'+esc(s.title)+'</h2>'+
      '<p class="lede">'+esc(s.lede)+'</p>'+
      '<div class="step-sequence">'+
      (s.chooseExit ? exitDeviceOptions() : '')+
      downloadCard(s.download)+
      resourceLinks(s.links)+
      (s.actionsFirst ? inlineActions(s.actions) : '')+
      (s.body||'')+
      (s.actionsFirst ? '' : inlineActions(s.actions))+
      (s.sim ? simRoute(s.sim) : '')+
      (s.kind==='check' ? simCheck(s.id) : '')+
      verification+
      help+
      (s.adv ? '<details class="adv"><summary>'+esc(s.adv.label)+'</summary><div class="advbody"><pre>'+esc(s.adv.code)+'</pre>'+(s.adv.note?'<p class="note">'+esc(s.adv.note)+'</p>':'')+'</div></details>' : '')+
      '</div>'+ 
      '<div class="actions">'+
        (S.i>0 ? '<button class="btn" data-nav="back">Back</button>' : '<button class="btn" data-go="goals">Change goal</button>')+
        '<span class="grow"></span>'+
        '<button class="btn primary" data-nav="next"'+(canContinue?'':' disabled')+'>'+(last?'Finish setup':'Continue')+'</button>'+ 
      '</div></section>';

    stage.innerHTML = '<div class="wiz">'+
      '<div class="progress-head">'+
        '<div class="progress-copy"><b>'+esc(META[S.path].label)+'</b><span>Step '+(S.i+1)+' of '+list.length+'</span></div>'+ 
        '<div class="meter"><i style="width:'+Math.round((S.i+1)/list.length*100)+'%"></i></div>'+ 
      '</div>'+panel+'</div>';
  }

  function vDone(){
    var list = steps();
    var done = list.filter(function(s){return S.done[s.id];}).length;
    var allDone = done===list.length;
    var goal = selectedGoal();
    var outcomes = {
      files:'Your files and media are ready to access.',
      desktop:'Your home computer is ready to access remotely.',
      bridge:'Your home network is ready to access through Tailscale.',
      exit:'Your home internet connection is ready to use through Tailscale.',
      share:'Your device is ready to share.',
      apps:'Your internal site is ready to access.',
      wfiles:'Your shared drive is ready to access.',
      servers:'Your server is ready to access with Tailscale SSH.',
      network:'Your office or cloud network is ready to access.',
      team:'Your team access setup is ready.'
    };

    stage.innerHTML =
      '<section>'+
        '<div class="donehead"><div class="tick">'+IC.checkBig+'</div>'+
        '<div><h1>'+(allDone?'Setup complete':'Setup paused')+'</h1>'+ 
        '<p>'+(allDone
          ? (outcomes[goal] || 'Your selected setup is ready.')
          : 'You completed '+done+' of '+list.length+' steps. Return to the setup to finish.')+'</p></div></div>'+ 
        '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
          '<button class="btn primary" data-go="machines">Return to Machines</button>'+ 
          '<button class="btn" data-go="another">Set up another use case</button>'+ 
        '</div>'+ 
      '</section>';
  }

  function render(){
    if(S.view==='machines') vMachines();
    else if(S.view==='pick') vPick();
    else if(S.view==='goals') vGoals();
    else if(S.view==='done') vDone();
    else vWizard();
  }

  /* ---------------- events ---------------- */

  document.addEventListener('click', function(e){
    var el;

    if((el = e.target.closest('[data-toggle]'))){
      var g = el.closest('.nav-group');
      var open = g.getAttribute('data-open')==='true';
      g.setAttribute('data-open', open?'false':'true');
      el.setAttribute('aria-expanded', open?'false':'true');
      return;
    }
    if((el = e.target.closest('[data-path]'))){
      S.path = el.getAttribute('data-path'); S.goals={}; S.i=0; S.done={}; S.actions={}; S.exitDevice=null;
      S.view='goals'; window.scrollTo(0,0); return render();
    }
    if((el = e.target.closest('[data-goal]'))){
      var k = el.getAttribute('data-goal');
      S.goals={}; S.goals[k]=true; S.exitDevice=null;
      return render();
    }
    if((el = e.target.closest('[data-exit-device]'))){
      var nextExitDevice = el.getAttribute('data-exit-device');
      if(S.exitDevice!==nextExitDevice){
        ['exit-device-download','exit-device-vpn','exit-device-connect','exit-advertise','exit-approve','travel-exit','exit-check'].forEach(function(id){delete S.actions[id];});
      }
      S.exitDevice = nextExitDevice;
      return render();
    }
    if((el = e.target.closest('[data-approve]'))){
      S.routes[el.getAttribute('data-approve')] = true; return render();
    }
    if((el = e.target.closest('[data-check]'))){
      var cid = el.getAttribute('data-check');
      S.checked[cid]='run'; render();
      setTimeout(function(){ S.checked[cid]='ok'; render(); }, 1100);
      return;
    }
    if((el = e.target.closest('[data-download-action]'))){
      S.actions[el.getAttribute('data-download-action')] = 'download';
      setTimeout(render,0);
      return;
    }
    if((el = e.target.closest('[data-installed-action]'))){
      S.actions[el.getAttribute('data-installed-action')] = 'installed';
      return render();
    }
    if((el = e.target.closest('[data-show-email]'))){
      var emailId = el.getAttribute('data-show-email');
      var form = document.querySelector('[data-email-form="'+emailId+'"]');
      if(form){ form.hidden=false; var field=form.querySelector('input'); if(field) field.focus(); }
      return;
    }
    if((el = e.target.closest('[data-send-email]'))){
      var sendId = el.getAttribute('data-send-email');
      var input = document.querySelector('[data-email-input="'+sendId+'"]');
      var error = document.querySelector('[data-email-error="'+sendId+'"]');
      if(!input || !input.value || !input.checkValidity()){
        if(input){ input.setAttribute('aria-invalid','true'); input.focus(); }
        if(error) error.hidden=false;
        return;
      }
      S.actions[sendId] = 'email';
      return render();
    }
    if((el = e.target.closest('[data-inline-action]'))){
      S.actions[el.getAttribute('data-inline-action')] = true;
      return render();
    }
    if((el = e.target.closest('[data-nav]'))){
      var act = el.getAttribute('data-nav'), list = steps();
      if(act==='next'){
        var cur = list[S.i];
        if(cur){ S.done[cur.id]=true; addDev(deviceForStep(cur)); }
        S.i++; if(S.i>=list.length) S.view='done';
      } else if(act==='skip'){
        S.i++; if(S.i>=list.length) S.view='done';
      } else if(act==='back'){
        if(S.view==='done'){ S.view='wizard'; S.i=Math.max(0,list.length-1); }
        else S.i=Math.max(0,S.i-1);
      }
      window.scrollTo(0,0); return render();
    }
    if((el = e.target.closest('[data-go]'))){
      var go = el.getAttribute('data-go');
      if(go==='restart'){ S={view:'pick',path:null,goals:{},i:0,done:{},devices:[],checked:{},routes:{},actions:{},exitDevice:null,dismissed:false}; }
      else if(go==='another'){ S.goals={}; S.i=0; S.done={}; S.actions={}; S.exitDevice=null; S.view='goals'; }
      else if(go==='dismiss'){ S.dismissed = true; }
      else S.view = go;
      window.scrollTo(0,0); return render();
    }
  });

  render();
})();
</script>
</body>
</html>
